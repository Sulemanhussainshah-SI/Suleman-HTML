<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>
  <style>
    body{
      margin: 0px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: #f5f5f7;
    }
    nav{
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0px;
    }
    .nav-container{
      width: 90%;
      max-width: 1100px;

      display: flex;
      justify-content:space-between;
      align-items: center;


    }.logo
    {
      font-size: 22px;
      font-weight: bold;

    }
    .manu
    {
      display: flex;
      gap: 20px;

    }
    .manu a{
      text-decoration: none;
      color: #333;
      font-size: 15px;
      letter-spacing: -0.4px;
      padding: 15px 0px;

    }
    .manu a:hover{
     color: #0071e3; 
    }
    .btn-blue{
      background: #0071e3;
      color: white;
      padding: 5px;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;

    }
    .btn-black{
      background: #1d1d1f;
      color: white;
      padding:5px;
      border-radius:7px ;
      font-size: 15px;
      cursor:pointer;
    }
    .btn-black:hover{
      color: white;
      
    }


  </style>
</head>
<body>
  <nav>
     <div class="nav-container">
       <div class="logo">🍎</div>



       <div class="manu">
        <a href="">Store</a>
        <a href="">Mac</a>
        <a href="">iPad</a>
        <a href="">iPhone</a>
        <a href="">Macbook</a>
        <a href="">Support</a>
       </div>


       <div class="Buttons">
        <button class="btn-blue"> Buy</button>
        <button class="btn-black">Login</button>

       </div>
     </div>
          
  </nav>
</body>
</html>
