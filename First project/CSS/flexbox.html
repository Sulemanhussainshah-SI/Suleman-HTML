<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex box container</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      padding: 40px;
    }
    .flex-box{
      display: flex;
      
      background: white;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    .items{
      background: #90e0ef;
      padding: 20px;
      margin: 10px;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      flex: 1;

    }
  </style>
</head>
<body>
  <h1>Flex Container & items <br>(Display: flex) </h1>
  <div class="flex-box">
      <div class="items"> Box1</div>
      <div class="items">Box2</div>
      <div class="items">Box3</div>

  </div>
</body>
</html>
