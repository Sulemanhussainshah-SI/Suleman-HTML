<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <style>
    body{
      background: #eef2f3;
      font-family: Arial, Helvetica, sans-serif;
      padding: 40px;

    }
    .container{
      display: grid;
      background: white;
      padding: 20px;
      border: 2px solid #e3e3e3;
      border-radius: 10px;


      gap: 10px;
    }
    .item{
      background: #90e0ef;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    } 
    .item:nth-child(2){background: #18ceee;}
    .item:nth-child(3){background: #09a4c0;}
    .item:nth-child(4){background: #237e8e;}
    .item:nth-child(5){background: #126472;}
  </style>
</head>
<body>
  <h1>Grid Container (display:grid;)</h1>
  <div class="container">
    <div class="item">1
      <ul>
        <li class
        >suleman</li>
      </ul>
    </div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
  </div>
</body>
</html>
