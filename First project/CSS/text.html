<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text </title>
  <style>
    h1{
      font-size: 8vh;
      font-weight: 900;
      font-style: normal;
      text-align: center;
    }
    p{
      font-size: 6vh;
      background-color: rgb(10, 239, 163);

      font-style:oblique
      

    }
    div p{

      font-weight: 600;
      background-position: center;
      background-attachment: scroll;
    }
  </style>
</head>
<body>
   <h1>Hi</h1>
   <p>this is paragraph</p>
   <div><p>Lorem ipsum dolor sit amet, <span style="font-style: italic;">consectetur </span> adipisicing elit. Beatae, delectus.</p></div>

</html>
