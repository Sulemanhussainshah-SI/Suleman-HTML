<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid flexbox</title>
  <style>
    body{
      background: #f5f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 30px;

    }
    .product-grid{
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    
      gap: 25px;

    }
    .card{
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ddd;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 1px 1px 3px rgba(0, 0, 0,0.2);
      cursor: pointer;
    }
    .card img{
      object-fit: contain;

    }
    .price{
      font-size: 20px;
      font-weight: bold;
    }
    .btn-row{
      display: flex;
      gap: 10px;

    }
    .btn-blue, .btn-black{
      padding: 8px 18px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      color: white;

    }
    .btn-blue{
      background: #0071e3;
    }
    .btn-black{
      background: #1d1d1f;
    }
    .card:hover{
      zoom:4vh;
    }

  </style>
</head>
<body>
   <h1>Products</h1>
   <div class="product-grid">

    <div class="card">
      <img src="https://inventstore.in/wp-content/uploads/2024/07/63.webp"  width="400px">
      <div class="price"> $999</div>
      <div class="btn-row">
        <button class="btn-blue">Buy</button>
        <button class="btn-black">Info</button>
      </div>
    </div>
   <div class="card">
      <img src="https://media.icdn.hu/product/2024-09/635680/1720381_apple-iphone-16-pro-128gb-fekete-titan.webp"  width="400px">
      <div class="price"> $2999</div>
      <div class="btn-row">
        <button class="btn-blue">Buy</button>
        <button class="btn-black">Info</button>
      </div>
    </div>
   <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSy5gnwQ1DeDJYdrUPjdNjn5uX91RK9qPLP5w&s"  width="400px">
      <div class="price"> $3999</div>
      <div class="btn-row">
        <button class="btn-blue">Buy</button>
        <button class="btn-black">Info</button>
      </div>
    </div>
   </div>
</body>
</html>
