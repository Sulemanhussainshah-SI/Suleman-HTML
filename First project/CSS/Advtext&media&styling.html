<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance text media styling</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  body{
    background:rgb(255, 254, 254);
  }
  h2{
    font-family: Roboto,sens-serif;
    color: whitesmoke;
  }
  h1
  {
    color: rgb(9, 4, 4);
    text-shadow: 1px 1px 3px rgba(0, 0, 0,0.3);
    letter-spacing: 1px;
    background: linear-gradient(to bottom right,rgb(226, 191, 125))rgb(214, 147, 12);
    border-radius: 10px;
    box-shadow: 0px 2px 5px 0.5px rgba(0 , 0, 0,0.5 );
  }
  .button{
     text-transform: capitalize;
     border-radius: 10px;
  }
  p{
    line-height: 1;
    letter-spacing: 0.4px;
    text-shadow: 1px 1px 3px ;
     }
     div{
      height: 200px;
      background:linear-gradient(to bottom,rgb(238, 191, 104),rgb(175, 115, 3));
      border-radius: 10px;
     }
     .name{
      text-align: center;
      padding: 10px;
      text-shadow: 1px 1px 3px;
      letter-spacing: 0.5px;
      color: darkolivegreen;

     }
     section div{
      background: radial-gradient(circle,rgb(230, 206, 163),rgb(141, 141, 228));
      margin: 30px;
      box-shadow: 2px 0px 1px 1px rgba(0,0,0,0.5 );
    }
    .intro{
      text-align: center;
      padding: 0.5px;
      letter-spacing: 1.2px;
      text-shadow: 1px 0.1px 1px rgba(88, 88, 220, 0.5); 
    }
    img{
      width: 200px;
      margin: 10px;
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(244, 240, 240, 0.2);
      filter: blur(1px);  
      object-fit: cover;
      }
    
</style>
</head>

<body>
     <h2>This is google font</h2>
     <main>
       <h1>Wellcome to Suleman World</h1>
       <button class="button"> contact us</button>
       <p>This is CSS <br>This is HTML</p>
     </main>
     <div>
      <h2 class="name">Suleman Hussain Shah</h2>
     </div>
     <section>
      <div class="intro"> <h3>About Suleman</h3>
      </div>
    </section>
    <img src="suleman2.jpeg" alt="suleman images">
</body>
</html>
