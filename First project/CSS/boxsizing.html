<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>box sizing</title>
  <style>
    *body{
      font-family: Arial, Helvetica, sans-serif;
      margin: 10px;
      width: 100%;

    }
    .container{
      width: 100%;
      padding: 20px;
      border: 2px solid black;
      margin-right: 10px;


    }
    .card1{
      width: 250px;
      padding: 10px;
      box-sizing: content-box;
      height: 200px;
      border: 2px solid #000;
      text-align: center;
      border-radius: 10px;
      font-weight:bold;
    }
    .card2{
      width: 250px;
      height:200px;
      box-sizing: border-box;
      border: 2px solid #000;
      margin-top: 20px;
      text-align:center;
      padding: 10px;
      border-radius: 10px;
      font-weight:bold;
    


    }
  </style>
</head>
<body>
  <h1>suleman</h1>


  <div class="container">
      <div class="card1">
        content box card
      </div>

      <div class="card2">
        border box card
      </div>
  </div>
</body>
</html>
