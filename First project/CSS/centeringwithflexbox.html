<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centering with flexbox 
  </title>
  <style>
    body{
      background:#e7f0f4;
      font-family:Arial, Helvetica, sans-serif;
      margin:30px;
    }
    .container{
      width: 400px;
      height: 380px;
      background: white;
      margin: 60px;
      border: 1px solid #ddd;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center; 
      box-shadow: 1px 2px 5px 2px rgba(0, 0, 0, 0.1);
    }
    .center{
      font-weight: bold;
      background-color: #00b4d8;
      padding: 22px;
      border-radius: 10px;
      color: white;
    }
  </style>
</head>
<body>
   <div class="container">
    <div class="center"> I am centered
    </div>
   </div>
</body>
</html>
