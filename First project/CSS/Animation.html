<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    .box{
      height: 90px;
      width: 80px;
      color: black;
      border: 1px solid gray;
      border-radius: 10px;
      font-weight:normal;
      background: goldenrod;
      position: relative;
      top: 20px;
      padding: 10px;
      left: 10px;
      box-shadow: 2px 0px 4px 1px rgba(0, 0, 0,0.7);


      animation-name: ghummakar;
      animation-duration: 2s;
      animation-timing-function: ease-in-out;
      animation-delay: 0s;

      animation-iteration-count: infinite;
      animation-direction:alternate;
    }
    @keyframes ghummakar{
      from{left: 10px;}
      to{left: 500px;}
    }
    .parent{
      height: 500px;
      width: 500px;
      border: 1px solid gray;
      border-radius: 10px;
      background-color: bisque;
      position: relative;
      top: 30px;
      padding: 15;
    }
    .box2{
      height: 10%;
      width: 15%;
      border: 1px solid gray;
      border-radius: 10px;
      background-color: burlywood;
      margin: 10px;
      padding: 10px;
      position: absolute;
      left: 1px;

      animation-name: Awara;
      animation-duration: 1s;
      animation-timing-function: ease-in-out;
      animation-delay: 0s;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    @keyframes Awara{
      0%{left: 10px;top: 0px;}
      20%{left: 300px;top: 30px;}
      50%{left: 200px; top: 50px;}
      100%{top: 0px;bottom: 500px;}
    }
  </style>
</head>
<body>
  <div class="box">Animation</div>
  <div class="parent">
      <div class="box2">Animation</div>
  </div>
</body>
</html>
