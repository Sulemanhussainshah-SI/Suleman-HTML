<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practices</title>
  <style>
    body{
      padding: 10px;
      margin: 10px;
      box-sizing: border-box;
      background:rgb(229, 218, 197);
    }
    .container{
      width: 100%;
      margin: 1px;
      border: 2px solid grey;
      height: 100%;
      background: linear-gradient(rgb(184, 163, 122),rgb(61, 61, 126));
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 150px;
      gap: 10px;
      border-radius: 10px;
    }
    .btn-1{
      margin: 100px;
      border: 2px dotted red;
      border-radius: 10%;
      font-size:  medium;
      font-weight: 600;
      padding-top:10px;
      padding-bottom: 15px;
      

    }
    .card1{
      width: 300px;
      height: 380px;
      margin: 10px;
      padding: 10px;
      box-sizing: content-box;
      border: 2px solid grey;
      border-radius: 10px;
      font-size: medium;
      font-weight: 700;
      background: #ff9a9e;
      box-shadow: 1px 0px 2px 2px rgba(0, 0, 0, 0.2);
    }
    .card2{
      width: 300px;
      height: 380px;
      margin: 10px;
      padding:10px;
      border:2px solid red;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: medium;
      font-weight: 700;
      box-shadow: 1px 0px 1px 1px rgba(0, 0,0,0.2);

    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn-1">contact me</button>



    <div class="card1">
      project 
    </div>
    <div class="card2">
      online classs
    </div>
  </div>
</body>
</html>
