<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marging cells</title>
</head>
<body>
     <h2>col span</h2>
    <table border="1">
        <tr>
            <th colspan="2"> fruits store</th>
        </tr>
        <tr>
            <td>apple</td>
            <td>120</td>
        </tr>
        <tr>
            <td>oranges</td>
            <td> 80</td>
        </tr>
    </table> <br>
    <h2> row span</h2>
    <table border="1">
          <tr>
              <th rowspan="3">fruits</th>
          </tr>
          <tr>
            <td>apple</td>
          </tr>
          <tr>
             <td>oranges</td>
          </tr>
          
      </table>
</body>
</html>
