<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>superscript and subscript</title>
</head>
<body>
     <p>
         (a+b)2 = a2 + b2 + 2ab
     </p> <hr>
     <p>
      (a+b) <sup>2</sup> = a <sup>2</sup> + b <sup>2</sup> + 2ab
     </p> <hr>
     <p>
       ch4 + o2 = h2o + co2
     </p> <HR></HR>
     <p>
      CH <SUB>4</SUB> + O <SUB>2</SUB> = H <SUB>2</SUB>O + CO <SUB>2</SUB>
     </p>
</body>
</html>
