<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro table</title>
</head>
<body>
    <table border="1">
          <thead>
                <tr>
                    <th>Fruits</th>
                    <th>Price</th>
                </tr>
          </thead>
          <tbody>
                <tr>
                    <td>apple</td>
                    <td>120</td>
                </tr>
                <tr>
                    <td>banana</td>
                    <td>40</td>
                </tr>
          </tbody>
          <tfoot>
                <tr>
                    <td>quantity : 2</td>
                    <td> 160</td>
                </tr>
          </tfoot>
    </table>
</body>
</html>
